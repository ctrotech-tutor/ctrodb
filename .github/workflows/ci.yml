name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Node 20 reached end-of-life in April 2026; 22 and 24 are what the
      # package claims to support, and both are tested on every push.
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install esbuild (pre-warm binary)
        run: npx --yes esbuild --version || true

      - run: npm ci

      - run: npm run typecheck
        name: TypeScript (src)

      - run: npm run typecheck:tests
        name: TypeScript (tests)

      - run: npm run lint
        name: Biome Lint

      - run: npm test
        name: Tests

      # Thresholds live in vitest.config.ts, so a coverage regression fails the
      # build instead of being discovered by users.
      - run: npm run test:coverage
        name: Tests (with coverage thresholds)
        if: matrix.node-version == 22

      - run: npm run build
        name: Build

      - run: node scripts/verify-package.mjs
        name: Verify package artifacts

      - run: npm run typecheck:smoke
        name: Type-check consumer (published declarations)

  declarations:
    name: Package resolution (@arethetypeswrong)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        name: Build

      # Catches the ".d.ts masquerading as ESM" class of bug for every
      # supported resolver (node10, node16 CJS/ESM, bundler).
      - run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .
        name: Check types for every module resolution mode
