name: Release

# Publishes to npm when a version tag is pushed. No manual publishing:
#   1. bump `version` in package.json (VERSION is injected from it at build time)
#   2. update CHANGELOG.md
#   3. git tag v<version> && git push origin v<version>
#
# Provenance is published via OIDC (id-token), so no NPM_TOKEN secret is needed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install esbuild (pre-warm binary)
        run: npx --yes esbuild --version || true
      - run: npm ci
      - run: npm run typecheck
        name: TypeScript (src)
      - run: npm run typecheck:tests
        name: TypeScript (tests)
      - run: npm run lint
        name: Biome Lint
      - run: npm test
        name: Tests

      - run: npm run test:coverage
        name: Tests (with coverage thresholds)
      - run: npm run build
        name: Build
      - name: Verify package contents
        run: node scripts/verify-package.mjs

      - name: Type-check consumer (published declarations)
        run: npm run typecheck:smoke

      - name: Check types for every module resolution mode
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack .

  create-release:
    name: Create GitHub Release
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release body
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

  publish-npm:
    name: Publish to npm
    needs: [quality, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build

      - name: Ensure the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Ensure the built runtime version matches package.json
        run: |
          built="$(node --input-type=module -e "import('./dist/index.mjs').then(m => console.log(m.VERSION))")"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$built" != "$pkg" ]; then
            echo "dist VERSION ($built) does not match package.json ($pkg)" >&2
            exit 1
          fi

      - name: Upgrade npm (required for OIDC provenance)
        run: npm install -g npm@latest

      - name: Strip _authToken from .npmrc (let OIDC kick in)
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then sed -i '/_authToken/d' "$npmrc"; fi

      - run: npm publish --provenance

      # `npm publish` returning 0 means npm accepted the write, not that the
      # version is readable yet. Registry reads lag the write, and a release
      # that silently never appears is invisible otherwise.
      - name: Confirm the version is readable from the registry
        run: |
          pkg="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if [ "$(npm view "ctrodb@$pkg" version 2>/dev/null)" = "$pkg" ]; then
              echo "ctrodb@$pkg is published and readable."
              exit 0
            fi
            echo "attempt $attempt/30: ctrodb@$pkg not readable yet, waiting 10s"
            sleep 10
          done
          echo "::warning::ctrodb@$pkg was published, but the registry still does not serve it after 5 minutes. Registry replication can lag; check https://www.npmjs.com/package/ctrodb/v/$pkg before assuming the publish failed."
